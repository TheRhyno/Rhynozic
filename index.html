<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rhynozic</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#FF0000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rhynozic" />
  <meta name="application-name" content="Rhynozic" />
  <meta name="description" content="Rhynozic – Lecteur musical" />
  <link rel="apple-touch-icon" href="Logo_Rhynozic.png" />

  <!-- Toast mise à jour PWA -->
  <style>
  #pwa-update-toast {
    display: none;
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: #1db954;
    color: #000;
    font-family: 'Segoe UI', sans-serif;
    font-size: 14px;
    font-weight: bold;
    padding: 12px 20px;
    border-radius: 30px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 99999;
    white-space: nowrap;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    opacity: 0;
    cursor: pointer;
    gap: 8px;
    align-items: center;
  }
  #pwa-update-toast.show {
    display: flex;
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  </style>

  <style>






* {
  box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  max-width: 100%;
}

html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  max-width: 100%;
  width: 100%;
  height: 100%;
  position: fixed;
  touch-action: none;
}




    body {
  padding-bottom: 80px;
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #181818;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
    }
    header {
      padding: 1rem;
      background-color: #FF0000;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }

.container {
  flex: 1;
  display: flex;
  flex-direction: row;
  overflow: hidden;
  align-items: stretch;
  position: relative;
}




    /* Sidebar playlists */
    .playlists-sidebar {
      width: 160px;
      background: #181818;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
      position: relative;
      z-index: 1000;
      flex-shrink: 0;
      height: 100%;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    .playlists-sidebar div {
      padding: 0.8rem 1rem;
      cursor: pointer;
      user-select: none;
      border-left: 4px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }
    .playlists-sidebar div:hover {
      background: #282828;
    }
    .playlists-sidebar div.active {
      background: #FF0000;
      color: #000;
      border-left-color: #FF0000;
      font-weight: bold;
    }

    /* Contenu scrollable dans la sidebar */
    .playlists-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    /* Footer du formulaire dans la sidebar */
    .playlists-sidebar-footer {
      padding: 10px;
      border-top: 1px solid #333;
      background-color: #181818;
    }

    /* Playlist des morceaux */
.playlist-container {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
}
    .search-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 15px;
    }

    #searchInput {
      width: 100%;
      padding: 10px 35px 10px 10px;
      background-color: #111;
      color: white;
      border: 1px solid #333;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }

    #clearSearch {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .track {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.3s, color 0.3s;
    }
    .track:hover, .track.active {
      background: #FF0000;
      color: #000;
    }

    .track-title {
      font-weight: bold;
    }

    .track-duration {
      font-size: 0.8em;
      color: gray;
      margin-top: 2px;
    }

    /* ===== MINI PLAYER (barre Spotify en bas) ===== */
.mini-player {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 72px;
  background: #1a1a1a;
  border-top: 1px solid #333;
  z-index: 2000;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.mini-player.visible {
  display: flex;
}
.mini-player-thumb {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}
.mini-player-info {
  flex: 1;
  overflow: hidden;
}
.mini-player-title {
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #fff;
}
.mini-player-sub {
  font-size: 12px;
  color: #aaa;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mini-player-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
.mini-player-controls button {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 4px;
}
.mini-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 3px;
  background: #FF0000;
  width: 0%;
  transition: width 0.5s linear;
}

/* ===== FULL SCREEN PLAYER (style Spotify) ===== */
.full-player {
  display: flex;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #1a0000 0%, #181818 60%);
  z-index: 3000;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  padding-bottom: 30px;
  /* Animation slide */
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
  will-change: transform;
}
.full-player.visible {
  transform: translateY(0);
}
/* Pendant le drag vers le bas */
.full-player.dragging {
  transition: none;
}
.full-player-header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 0;
}
.full-player-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  padding: 8px;
}
.full-player-label {
  font-size: 13px;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}
.full-player-thumb {
  width: min(300px, 80vw);
  height: min(300px, 80vw);
  border-radius: 12px;
  object-fit: cover;
  margin: 24px auto 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  flex-shrink: 0;
}
.full-player-title {
  font-size: 1.3rem;
  font-weight: bold;
  text-align: center;
  padding: 0 24px;
  color: #fff;
}
.full-player-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 16px 0 0;
}
.full-player-controls button {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  padding: 6px;
  transition: color 0.2s;
}
.full-player-controls button.active { color: #1db954; }
.full-player-controls #fullPlayPauseBtn { font-size: 2.4rem; }
.full-progress-bar {
  width: 85%;
  height: 5px;
  background: #444;
  border-radius: 3px;
  margin: 16px auto 4px;
  cursor: pointer;
  position: relative;
}
.full-progress {
  height: 5px;
  background: #FF0000;
  width: 0;
  border-radius: 3px;
  pointer-events: none;
}
.full-time-info {
  width: 85%;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  color: #aaa;
}
.full-volume {
  width: 85%;
  margin: 12px auto 0;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #aaa;
  font-size: 1rem;
}
.full-volume input { flex: 1; }

/* Bouton micro dans le full player */
.full-mic-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 1.6rem;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 18px auto 0;
  transition: background 0.2s;
}
.full-mic-btn:hover { background: rgba(255,255,255,0.2); }

/* ===== ÉCRAN PAROLES PLEIN ÉCRAN ===== */
.lyrics-screen {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, #2a0000 0%, #111 70%);
  z-index: 4000;
  flex-direction: column;
  overflow: hidden;
}
.lyrics-screen.visible { display: flex; }

.lyrics-screen-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 16px 10px;
  flex-shrink: 0;
}
.lyrics-screen-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
  padding: 6px 10px;
}
.lyrics-screen-title {
  font-size: 14px;
  color: #aaa;
  font-weight: bold;
  text-align: center;
  flex: 1;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.lyrics-screen-track {
  font-size: 13px;
  color: #ccc;
  text-align: center;
  padding: 0 20px 10px;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lyrics-screen-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 24px 20px;
  text-align: center;
  white-space: pre-wrap;
  font-family: Arial, sans-serif;
  color: #fff;
  font-size: 16px;
  line-height: 1.8;
}
.lyrics-screen-body p { margin: 0 0 2px; }
.lyrics-screen-footer {
  flex-shrink: 0;
  padding: 12px 20px 20px;
  display: flex;
  justify-content: center;
}
.lyrics-mode-toggle {
  background: #FF0000;
  color: #000;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
}
/* ligne courante surlignée en mode sync */
.lyrics-screen-body .current-lyric {
  color: #FF0000;
  font-weight: bold;
  font-size: 18px;
}

/* Supprimer les anciens onglets / panel paroles dans full player */
.full-tabs { display: none !important; }
.full-lyrics-panel { display: none !important; }
.full-sync-btn { display: none !important; }

    /* Player (ancien — masqué mais conservé) */
.player {
  display: none;
  padding-bottom: 1cm;
  padding-bottom: env(safe-area-inset-bottom);
  background-color: #181818;
  padding-top: 0;
  margin-top: 0;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  position: relative;
  z-index: 10;
}


    .thumbnail {       
width: 200px;       
height: 200px;       
object-fit: cover;       
border-radius: 8px;       
margin-bottom: 0.3rem;     
}


    #now-playing {
      font-weight: bold;
      margin-bottom: -1rem;
      text-align: center;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 8px;
      user-select: none;
      transition: color 0.3s;
    }
    .controls button.active {
      color: #1db954;
    }
    .progress-bar {
      width: 80%;
      height: 5px;
      background: #333;
      margin-top: 1rem;
      position: relative;
      cursor: pointer;
      border-radius: 3px;
    }
    .progress {
      height: 5px;
      background: #FF0000;
      width: 0;
      border-radius: 3px;
    }
    .time-info {
      width: 80%;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .volume {
      margin-top: 1rem;
      width: 80%;
    }

    /* Paroles */
    #lyrics {
      margin-top: 1rem;
      max-width: 80%;
      max-height: 150px;
      overflow-y: auto;
      text-align: center;
      white-space: pre-wrap;
      padding: 0.5rem;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      background-color: #181818;
      color: #ffffff;
      max-height: 300px;
      padding: 15px;
      border: 1px solid #aaa;
      font-family: 'Arial', sans-serif;
      box-sizing: border-box;
      width: fit-content;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 10px;
    }

    /* Recherche */
    #searchContainer {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #111;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      background-color: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
    }

    #clearSearch {
      background: none;
      border: none;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
    }


#toggleLyricsModeBtn {
  background-color: #FF0000; /* rouge vif */
  color: #000;               /* texte noir */
  border: none;
  padding: 10px 15px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  font-size: 1rem;
  transition: background-color 0.3s ease;
  
  /* Ajout pour remonter et éviter les boutons bas */
  margin-bottom: env(safe-area-inset-bottom, 20px);
  position: relative;
  z-index: 1001;
}

#toggleLyricsModeBtn:hover {
  background-color: #FF0000; /* rouge un peu plus foncé au hover */
}

.bottom-blank {
  height: 1cm;
      background-color: #181818;
  width: 100vw;
  flex-shrink: 0;
  position: fixed;
  bottom: 0;
  left: 0;
  z-index: 999;
}


.add-to-tempQueue-btn {
  /* pas besoin de position absolute, juste style simple */
  background-color: #4CAF50;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  transition: background-color 0.3s ease;
}

.add-to-tempQueue-btn:hover {
  background-color: #45a049;
}





    /* Responsive */

    @media (max-width: 768px) {
      .playlists-sidebar {
        position: fixed;
        top: 50px; /* hauteur header */
        left: 0;
        bottom: 0;
        width: 250px;
        background: #181818;
        border-right: 1px solid #333;
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: 1000;
        display: flex;
        flex-direction: column;
      }
      .playlists-sidebar.open {
        transform: translateX(0);
      }
      .playlists-content {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0;
      }
      .playlists-sidebar-footer {
        padding: 10px;
        border-top: 1px solid #333;
        background-color: #181818;
      }
      .player {
        width: 100%;
        padding: 1rem 0.5rem;
      }
      .thumbnail {
        width: 150px;
        height: 150px;
      }
      .controls {
        flex-wrap: wrap;
        justify-content: center;
      }
      .progress-bar, .time-info, .volume, #lyrics {
        width: 95%;
      }
      #lyrics {
        font-size: 0.9rem;
        max-height: 120px;
      }
      #lyrics, #playlist, #now-playing {
        padding: 10px;
        font-size: 15px;
      }
      .track {
        font-size: 14px;
        padding: 10px;
      }
      #searchInput {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header>Rhynozic</header>
  <div class="container">

    <div class="playlists-sidebar" id="playlistsSidebar">
      <div class="playlists-content">
        <!-- Playlists ajoutées dynamiquement -->
      </div>
      <div class="playlists-sidebar-footer">
        <form id="prenomForm" style="display: flex; flex-direction: column; gap: 8px;">
          <label for="prenomInput" style="margin: 0;">Quelle(s) chanson(s) aimeriez-vous ajoutée(s) ?</label>
          <input type="text" id="prenomInput" name="Prénom" required style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
          <button type="submit" style="padding: 6px 12px; background-color: #1db954; color: black; border: none; border-radius: 4px; cursor: pointer;">Envoyer</button>
        </form>
        <div id="responseMessage" style="margin-top: 10px; color: lightgreen;"></div>
      </div>
    </div>

    <div class="playlist-container">
      <div class="search-wrapper">
        <input
          id="searchInput"
          type="text"
          placeholder="🔍 Rechercher une musique..."
          oninput="toggleClearButton()"
        />
        <button
          id="clearSearch"
          onclick="clearSearch()"
          style="display: none;"
        >❌</button>
      </div>
      <div id="playlist"></div>
    </div>

  </div><!-- end .container -->

  <!-- Player caché (conservé pour compatibilité JS) -->
  <div class="player">
    <img id="thumbnail" class="thumbnail" src="https://i.pinimg.com/736x/47/4c/57/474c57724fce98d50251cc5c2c463849.jpg" />
    <div id="now-playing">Choisissez un morceau</div>
    <div class="controls">
      <button onclick="prevTrack()" title="Précédent">⏮️</button>
      <button onclick="togglePlay()" id="playPauseBtn" title="Play/Pause">▶️</button>
      <button onclick="nextTrack()" title="Suivant">⏭️</button>
      <button onclick="recommencerMusiqueActive()" title="Recommencer">🔁</button>
      <button onclick="toggleShuffle()" id="shuffleBtn" title="Shuffle">🔀</button>
      <button onclick="toggleRepeat()" id="repeatBtn" title="Repeat">🔁</button>
    </div>
    <div class="progress-bar" onclick="seek(event)">
      <div class="progress" id="progress"></div>
    </div>
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>
    <div id="lyrics"></div>
    <div id="lyricsControls" style="margin-top: 10px;">
      <button id="toggleLyricsModeBtn">🕓 Sync</button>
    </div>
  </div>
  <audio id="audio"></audio>


<div class="mini-player" id="miniPlayer">
  <div class="mini-progress" id="miniProgress"></div>
  <img class="mini-player-thumb" id="miniThumb" src="https://i.pinimg.com/736x/47/4c/57/474c57724fce98d50251cc5c2c463849.jpg" />
  <div class="mini-player-info" id="miniInfo">
    <div class="mini-player-title" id="miniTitle">Choisissez un morceau</div>
    <div class="mini-player-sub" id="miniSub">Rhynozic</div>
  </div>
  <div class="mini-player-controls">
    <button onclick="event.stopPropagation(); togglePlay()" id="miniPlayPauseBtn">▶️</button>
    <button onclick="event.stopPropagation(); nextTrack()">⏭️</button>
  </div>
</div>

<!-- ===== FULL PLAYER ===== -->
<div class="full-player" id="fullPlayer">
  <div class="full-player-header">
    <button class="full-player-close" onclick="closeFullPlayer()">⌄</button>
    <span class="full-player-label">En cours de lecture</span>
    <span style="width:40px;"></span>
  </div>

  <img class="full-player-thumb" id="fullThumb" src="https://i.pinimg.com/736x/47/4c/57/474c57724fce98d50251cc5c2c463849.jpg" />
  <div class="full-player-title" id="fullTitle">Choisissez un morceau</div>

  <div class="full-player-controls">
    <button onclick="toggleShuffle()" id="fullShuffleBtn" title="Shuffle">🔀</button>
    <button onclick="prevTrack()">⏮️</button>
    <button onclick="togglePlay()" id="fullPlayPauseBtn">▶️</button>
    <button onclick="nextTrack()">⏭️</button>
    <button onclick="toggleRepeat()" id="fullRepeatBtn" title="Repeat">🔁</button>
  </div>

  <div class="full-progress-bar" id="fullProgressBar">
    <div class="full-progress" id="fullProgress"></div>
  </div>
  <div class="full-time-info">
    <span id="fullCurrentTime">0:00</span>
    <span id="fullDuration">0:00</span>
  </div>

  <div class="full-volume">
    🔈 <input type="range" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)" />
  </div>

  <!-- Bouton micro pour ouvrir les paroles -->
  <button class="full-mic-btn" onclick="openLyricsScreen()" title="Paroles">🎤</button>

  <!-- Onglets (conservés mais cachés via CSS) -->

// Affiche la sidebar playlists
function displayPlaylistsSidebar() {
  playlistsSidebar.innerHTML = "";
  Object.keys(playlists).forEach(name => {
    const div = document.createElement("div");

function addToQueue(track) {
  tempQueue.push(track);
}


function playNextTrack() {
  if (tempQueue.length > 0) {
    const next = tempQueue.shift(); // joue depuis le "dossier invisible"
    playTrack(next);
  } else {
    playNextFromPlaylist(); // reprend la playlist classique
  }
}





// Affiche la playlist filtrée
function displayPlaylist() {
  playlistDiv.innerHTML = "";

  // 🔢 Calcul de la durée totale de la playlist affichée
  const totalSeconds = filteredPlaylist.reduce((sum, track) => sum + (track.duration || 0), 0);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);

  let totalDurationText = "⏱️ Durée totale : ";
  if (hours > 0) {
    totalDurationText += `${hours}h `;
  }
  totalDurationText += `${minutes}min`;

  // 🏷️ Affiche la durée totale au-dessus de la playlist
  const durationDiv = document.createElement("div");
  durationDiv.style.padding = "8px";
  durationDiv.style.fontWeight = "bold";
  durationDiv.style.color = "#555";
  durationDiv.textContent = totalDurationText;
  playlistDiv.appendChild(durationDiv);

  filteredPlaylist.forEach((track, index) => {
    const div = document.createElement("div");
    div.className = "track";
    if (index === currentTrack) div.classList.add("active");

    // Ajout flex et alignement vertical
    div.style.display = "flex";
    div.style.alignItems = "center";

    // Image miniature à gauche
    const img = document.createElement("img");
    img.src = track.img;
    img.alt = track.title;
    img.style.width = "40px";     
    img.style.height = "40px";
    img.style.objectFit = "cover";
    img.style.marginRight = "10px";
    img.style.verticalAlign = "middle";

    // Container texte (titre + durée)
    const textContainer = document.createElement("div");
    textContainer.style.display = "inline-block";
    textContainer.style.verticalAlign = "middle";

    // Titre
    const titleSpan = document.createElement("div");
    titleSpan.textContent = track.title;
    titleSpan.style.fontWeight = "bold";

    // Durée
    const durationSpan = document.createElement("div");
    durationSpan.textContent = formatTime(track.duration || 0);
    durationSpan.style.fontSize = "0.8em";
    durationSpan.style.color = "gray";
    durationSpan.style.marginTop = "2px";

    // Ajout titre + durée dans container texte
    textContainer.appendChild(titleSpan);
    textContainer.appendChild(durationSpan);

    // Bouton ajouter au dossier invisible
    const addButton = document.createElement("button");
    addButton.textContent = "+";
    addButton.title = "Ajouter à la file d'attente";

    // Décalage automatique à droite
    addButton.style.marginLeft = "auto";

    addButton.onclick = (e) => {
      e.stopPropagation(); // éviter de lancer playTrack en même temps
      addToQueue(index); // ajoute la piste à tempQueue
      alert(`"${track.title}" ajouté à la file d'attente !`);
    };

    // Ajout image + texte + bouton dans la div track
    div.appendChild(img);
    div.appendChild(textContainer);
    div.appendChild(addButton);

    // Clique sur la div joue la piste
    div.onclick = () => {
      currentTrack = index;
      playTrack(currentTrack);
      updatePlaylistHighlight();
    };

    playlistDiv.appendChild(div);
  });

  updatePlaylistHighlight();
}




function updatePlaylistHighlight() {
  const tracks = playlistDiv.querySelectorAll(".track");
  tracks.forEach((t, i) => {
    t.classList.toggle("active", i === currentTrack);
  });
}





// Affiche les paroles selon le type de piste (sync ou non)
function displayLyrics(index) {
  const track = filteredPlaylist[index];

  currentLyricIndex = 0;
  lyricsData = [];

  // 🔥 Ce que tu veux : remettre Sync si dispo
if (!userToggledLyricsMode) {
  useSyncedLyrics = track.isSynced && (track.lyrics || track.lyricsUrlSynced);
}


  lyricsDisplay.innerText = "Chargement des paroles...";

const updateLyricsModeButton = () => {
  const btn = document.getElementById("toggleLyricsModeBtn");
  btn.textContent = useSyncedLyrics ? "📃 Passer en paroles simples" : "🕓 Passer en paroles sync";
};


  const tryLoadTextLyrics = () => {
    updateLyricsModeButton(); // 👈 Assure la mise à jour du bouton

    // 3. Si les paroles texte sont à charger via un lien externe
    if (track.lyricsUrlText) {
      fetch(track.lyricsUrlText)
        .then(response => {
          if (!response.ok) throw new Error("Erreur de chargement");
          return response.text();
        })
        .then(data => {
          lyricsDisplay.innerHTML = data
            .split('\n')
            .map(line => `<p>${line}</p>`)
            .join('');
        })
        .catch(err => {
          lyricsDisplay.innerText = "Impossible de charger les paroles.";
          console.error(err);
        });
      return;
    }

    // 2. Si les paroles texte sont incluses directement
    if (track.lyrics) {
      if (Array.isArray(track.lyrics)) {
        lyricsDisplay.innerHTML = track.lyrics.map(line => `<p>${line}</p>`).join('');
      } else if (typeof track.lyrics === 'string') {
        lyricsDisplay.innerHTML = track.lyrics.split('\n').map(line => `<p>${line}</p>`).join('');
      }
      return;
    }

    // 4. Si rien n’est disponible
    lyricsDisplay.innerText = "Aucune parole disponible.";
  };

  updateLyricsModeButton();
  tryLoadTextLyrics();
});

    return;
  }

  // 3. Mode SYNC activé mais rien de dispo => message + fallback
  if (useSyncedLyrics) {
    useSyncedLyrics = false;
    lyricsDisplay.innerText = "Paroles synchronisées indisponibles. Affichage du mode texte.";

function playTrack(index) {
  currentTrack = index;
  const track = filteredPlaylist[index];
  audio.src = track.url;
  nowPlaying.innerText = `🎵 ${track.title}`;
  thumbnail.src = track.img;

updateMediaSession(track);

  updatePlaylistHighlight();

  clearInterval(window.lyricsInterval); // évite les doublons si on change de chanson
  if (track.isSynced) {
    window.lyricsInterval = setInterval(() => {
      if (!audio.paused) {
        updateLyrics(audio.currentTime);
      }
    }, 500);
  }

  // ===== MEDIA SESSION API (notification système) =====
  if ('mediaSession' in navigator) {
    // Extraire artiste depuis le titre (format "Titre - Artiste")
    let artistName = 'Rhynozic';
    let songTitle = track.title;
    const dashIdx = track.title.lastIndexOf(' - ');
    if (dashIdx !== -1) {
      songTitle = track.title.substring(0, dashIdx).trim();
      artistName = track.title.substring(dashIdx + 3).trim();
    }

    navigator.mediaSession.metadata = new MediaMetadata({
      title: songTitle,
      artist: artistName,
      album: 'Rhynozic',
      artwork: [
        { src: track.img, sizes: '96x96',   type: 'image/jpeg' },
        { src: track.img, sizes: '128x128',  type: 'image/jpeg' },
        { src: track.img, sizes: '192x192',  type: 'image/jpeg' },
        { src: track.img, sizes: '256x256',  type: 'image/jpeg' },
        { src: track.img, sizes: '384x384',  type: 'image/jpeg' },
        { src: track.img, sizes: '512x512',  type: 'image/jpeg' },
      ]
    });

    navigator.mediaSession.setActionHandler('play', () => {
      audio.play();
      playPauseBtn.textContent = "⏸️";
      navigator.mediaSession.playbackState = 'playing';
    });
    navigator.mediaSession.setActionHandler('pause', () => {
      audio.pause();
      playPauseBtn.textContent = "▶️";
      navigator.mediaSession.playbackState = 'paused';
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      nextTrack();
    });
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      prevTrack();
    });
    navigator.mediaSession.setActionHandler('seekto', (details) => {
      if (details.seekTime !== undefined) {
        audio.currentTime = details.seekTime;
      }
    });
    navigator.mediaSession.setActionHandler('seekbackward', (details) => {
      audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
    });
    navigator.mediaSession.setActionHandler('seekforward', (details) => {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + (details.seekOffset || 10));
    });

    navigator.mediaSession.playbackState = 'playing';
  }
}

// Format temps (mm:ss)
function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}:${sec < 10 ? "0" + sec : sec}`;
}




function parseLyrics(lrcText) {
  lyricsData = [];

  const lines = lrcText.split('\n');

  for (let line of lines) {
    const matches = [...line.matchAll(/\[(\d{2}):(\d{2})(?:\.(\d{2}))?\]/g)];
    const text = line.replace(/\[.*?\]/g, '').trim(); // Supprime tous les timestamps

    for (let match of matches) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const ms = match[3] ? parseInt(match[3]) : 0;
      const time = min * 60 + sec + ms / 100;

      lyricsData.push({ time, text });
    }
  }

  // Tri des paroles par temps croissant
  lyricsData.sort((a, b) => a.time - b.time);
}


function updateLyrics(currentTime) {
  if (!lyricsData || lyricsData.length === 0) return;

  let currentLine = "";
  for (let i = 0; i < lyricsData.length; i++) {
    if (currentTime >= lyricsData[i].time) {
      currentLine = lyricsData[i].text;
    } else {
      break;
    }
  }

  if (lyricsDisplay.innerText !== currentLine) {
    lyricsDisplay.innerText = currentLine;
  }
}

// ===== SWIPE DOWN POUR FERMER LE FULL PLAYER =====
(function() {
  const fp = document.getElementById('fullPlayer');
  let startY = 0;
  let startScrollTop = 0;
  let isDraggingDown = false;

  fp.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
    startScrollTop = fp.scrollTop;
    isDraggingDown = false;
  }, { passive: true });

  fp.addEventListener('touchmove', function(e) {
    const dy = e.touches[0].clientY - startY;
    // On ne déclenche le drag que si on est en haut du scroll ET qu'on tire vers le bas
    if (dy > 0 && fp.scrollTop <= 0) {
      isDraggingDown = true;
      fp.classList.add('dragging');
      fp.style.transform = `translateY(${Math.max(0, dy)}px)`;
      // Assombrir légèrement
      const opacity = Math.max(0.3, 1 - dy / 400);
      fp.style.opacity = opacity;
    }
  }, { passive: true });

  fp.addEventListener('touchend', function(e) {
    if (!isDraggingDown) return;
    fp.classList.remove('dragging');
    fp.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 100) {
      // Fermer avec animation
      fp.style.transition = 'transform 0.32s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.32s ease';
      fp.style.transform = 'translateY(100%)';
      fp.style.opacity = '0';
      setTimeout(() => {
        fp.classList.remove('visible');
        fp.style.transform = '';
        fp.style.opacity = '';
        fp.style.transition = '';
      }, 340);
    } else {
      // Remettre en place
      fp.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s ease';
      fp.style.transform = 'translateY(0)';
      fp.style.opacity = '1';
      setTimeout(() => {
        fp.style.transform = '';
        fp.style.opacity = '';
        fp.style.transition = '';
      }, 320);
    }
    isDraggingDown = false;
  }, { passive: true });
})();

  lastPrevTapTime = now;

  // Si double-tap rapide (< 500ms) OU chanson < 3s → chanson précédente
  if (timeSinceLast < 500 || audio.currentTime < 3) {

    audio.currentTime = 0;
    if (audio.paused) {

  }
}

  body.innerHTML = src.innerHTML || `<p>${src.innerText || 'Aucune parole disponible.'}</p>`;
}

function toggleLyricsModeFromScreen() {
  // Déclenche le toggle du mode via le bouton caché
  document.getElementById('toggleLyricsModeBtn').click();
  // Met à jour l'écran paroles après rechargement
  setTimeout(() => {
    syncLyricsScreen();
  }, 400);
}

// Observer les paroles dans #lyrics pour les refléter dans l'écran paroles
const lyricsScreenObserver = new MutationObserver(() => {
  refreshLyricsScreenBody();
  // Sync le bouton mode aussi
  const btn = document.getElementById('lyricsModeToggleBtn');
  if (btn) btn.textContent = useSyncedLyrics ? '📃 Passer en paroles simples' : '🕓 Passer en paroles sync';
});
lyricsScreenObserver.observe(document.getElementById('lyrics'), { childList: true, characterData: true, subtree: true });

// Quand on change de piste, mettre à jour l'écran paroles si ouvert
const _origNowPlayingObserver = new MutationObserver(() => {
  const track = filteredPlaylist[currentTrack];
  if (!track) return;
  if (document.getElementById('lyricsScreen').classList.contains('visible')) {
    syncLyricsScreen();
  }
});
_origNowPlayingObserver.observe(document.getElementById('now-playing'), { childList: true, characterData: true, subtree: true });

// ================================================================
// SERVICE WORKER PWA + DÉTECTION DE MISE À JOUR AUTOMATIQUE
// ================================================================
(function initPWA() {
  if (!('serviceWorker' in navigator)) return;

  let newWorker = null;

  // Créer le toast une seule fois dans le DOM
  let toast = document.getElementById('pwa-update-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'pwa-update-toast';
    toast.innerHTML = '🔄 Nouvelle version disponible !';
    document.body.appendChild(toast);
  }

  function showUpdateToast() {
    // Petite pause pour que l'animation soit visible après le display:flex
    setTimeout(() => toast.classList.add('show'), 50);
    // Au tap : activer le nouveau SW et recharger
    toast.onclick = () => {
      toast.innerHTML = '⏳ Mise à jour en cours…';
      if (newWorker) {
        newWorker.postMessage({ type: 'SKIP_WAITING' });
      } else {
        window.location.reload();
      }
    };
  }

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(reg => {
        console.log('[SW] Enregistré ✓ scope:', reg.scope);

        // ── Vérifier si un SW en attente existe déjà (ex: premier chargement après update) ──
        if (reg.waiting) {
          newWorker = reg.waiting;
          showUpdateToast();
        }

        // ── Nouveau SW en cours d'installation ──
        reg.addEventListener('updatefound', () => {
          const installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', () => {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              // Nouveau SW installé ET un ancien SW contrôle déjà la page → mise à jour dispo
              newWorker = installing;
              showUpdateToast();
            }
          });
        });

        // ── Forcer la vérification de mise à jour à chaque démarrage ──
        reg.update();
        // Re-vérifier toutes les 60 secondes si l'app reste ouverte
        setInterval(() => reg.update(), 60 * 1000);
      })
      .catch(err => console.warn('[SW] Erreur:', err));

    // ── Quand le SW change (après skipWaiting) → recharger la page ──
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
})();

// ================================================================
// AUDIO BACKGROUND : empêcher l'OS de couper la lecture
// ================================================================
(function keepAudioAlive() {
  const audioEl = document.getElementById('audio');
  if (!audioEl) return;

  audioEl.setAttribute('playsinline', '');
  audioEl.setAttribute('webkit-playsinline', '');
  audioEl.setAttribute('x-webkit-airplay', 'allow');
  audioEl.preload = 'auto';

  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (err) {}
  }
  async function releaseWakeLock() {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  }

  audioEl.addEventListener('play', () => {
    requestWakeLock();
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'TRACK_CHANGED' });
    }
  });
  audioEl.addEventListener('pause', () => {
    setTimeout(() => { if (audioEl.paused) releaseWakeLock(); }, 30000);
  });
  audioEl.addEventListener('ended', releaseWakeLock);

  audioEl.addEventListener('abort', () => {
    if (!audioEl.paused && audioEl.src) {
      setTimeout(() => audioEl.play().catch(() => {}), 500);
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (audioEl.src && !audioEl.paused && audioEl.readyState < 3) {
        audioEl.play().catch(() => {});
      }
      if (!audioEl.paused) requestWakeLock();
    }
  });

  setInterval(() => {
    if (!audioEl.paused && audioEl.src && audioEl.readyState === 0) {
      const t = audioEl.currentTime;
      audioEl.load();
      audioEl.currentTime = t;
      audioEl.play().catch(() => {});
    }
  }, 25000);
})();
